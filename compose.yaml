services:
  db:
    user: "${UID:-1000}:${GID:-1000}"
    image: postgres:16-bookworm
    env_file:
      - path: "docker/env/db"
        required: true
      - path: "docker/env/db.local"
        required: false
    shm_size: 8g
    volumes:
      - ${PWD}/docker/data/db:/var/lib/postgresql/data
      - ${PWD}/docker/conf/db/postgresql.conf:/etc/postgresql/postgresql.conf
    command: -c "config_file=/etc/postgresql/postgresql.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 5

  main:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: "docker/env/main"
        required: true
      - path: "docker/env/main.local"
        required: false
    volumes:
      - .:/app
    depends_on:
      - db
